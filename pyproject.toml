[project]
name = "jazz-pianist-style"
version = "1.0.0"
description = "Learning Jazz Pianist Style with Cross-Attention Conditioning (ISMIR 2026) - models, training, and evaluation code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Drew Edwards" }]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "jsonlines>=4.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "pretty_midi>=0.2.10",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    "aria",
    "ariautils",
]

[tool.uv.sources]
aria = { git = "https://github.com/EleutherAI/aria.git", rev = "c2f67bc90b49" }
ariautils = { git = "https://github.com/EleutherAI/aria-utils.git", rev = "4ed0749d2d70" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama_pijama"]
